name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-figures.txt
      - run: python -m pip install -r requirements.txt -r requirements-figures.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_code.py --include-pdf
      - run: python scripts/verify_release.py
      - run: python scripts/run_analysis.py --list --stage all
